services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped

    ports:
      - "${MSSQL_PORT}:1433"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - flowers-network
    
  identityservice:
    # Repository comes from CI (${DOCKERHUB_USERNAME}/flowerapp-identity-service);
    # locally it stays an unqualified, never-pushed image.
    image: ${IDENTITY_IMAGE:-flowerapp-identity-service}:${IDENTITY_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: src/Services/IdentityService/Dockerfile
    restart: unless-stopped

    ports:
      - "${IDENTITY_HTTP_PORT}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__AuthDatabase: Server=${SQL_SERVER};Database=${AUTH_DATABASE_NAME};User Id=${SQL_USER};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;

      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__AccessTokenExpiryMinutes: ${Jwt__AccessTokenExpiryMinutes}
      Jwt__RefreshTokenExpiryDays: ${Jwt__RefreshTokenExpiryDays}

      Firebase__CredentialsPath: /run/secrets/firebase-service-account.json
      Redis__ConnectionString: redis:6379

      Email__SmtpHost: ${Email__SmtpHost}
      Email__SmtpPort: ${Email__SmtpPort}
      Email__SenderEmail: ${Email__SenderEmail}
      Email__SenderName: ${Email__SenderName}
      Email__Username: ${Email__Username}
      Email__Password: ${Email__Password}
      Email__EnableSsl: ${Email__EnableSsl}

      Otp__PepperSecret: ${Otp__PepperSecret}

      AdminSeed__Email: ${AdminSeed__Email}
      AdminSeed__Password: ${AdminSeed__Password}
      AdminSeed__FirstName: ${AdminSeed__FirstName}
      AdminSeed__LastName: ${AdminSeed__LastName}
      AdminSeed__PhoneNumber: ${AdminSeed__PhoneNumber}

      # NOTE: no RabbitMQ__* variables are passed - the application references
      # MassTransit but does not configure a bus yet, so nothing would read them.
      # Add them here together with the bus registration.

    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

    # GET /health reports the service plus its AuthDbContext connection. The long
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    depends_on:
      rabbitmq:
        condition: service_healthy

      redis:
        condition: service_healthy

      sqlserver:
        condition: service_healthy

    networks:
      - flowers-network

  catalogservice:
    image: ${CATALOG_IMAGE:-flowerapp-catalog-service}:${CATALOG_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: src/Services/CatalogService/Dockerfile
    restart: unless-stopped

    ports:
      - "${CATALOG_HTTP_PORT}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__CatalogDatabase: Server=${SQL_SERVER};Database=${CATALOG_DATABASE_NAME};User Id=${SQL_USER};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;

      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Redis__ConnectionString: redis:6379

    # GET /health reports the service plus its CatalogDbContext connection. The long
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - flowers-network

  rabbitmq:
    image: rabbitmq:3-management

    restart: unless-stopped

    ports:
      - "${RABBITMQ_PORT}:5672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - flowers-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - flowers-network

  apigateway:
    # Repository comes from CI (${DOCKERHUB_USERNAME}/flowerapp-api-gateway);
    # locally it stays an unqualified, never-pushed image.
    image: ${GATEWAY_IMAGE:-flowerapp-api-gateway}:${GATEWAY_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    restart: unless-stopped

    ports:
      - "${GATEWAY_HTTP_PORT}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}

      # Overrides the localhost values in .env: inside the network the gateway reaches the
      # services by compose service name, not by their published host ports.
      Gateway__IdentityServiceUrl: http://identityservice:8080
      Gateway__CatalogServiceUrl: http://catalogservice:8080

      Gateway__AllowedOrigins: ${Gateway__AllowedOrigins}

      Gateway__RateLimiting__Auth__PermitLimit: ${Gateway__RateLimiting__Auth__PermitLimit}
      Gateway__RateLimiting__Auth__WindowSeconds: ${Gateway__RateLimiting__Auth__WindowSeconds}
      Gateway__RateLimiting__Default__PermitLimit: ${Gateway__RateLimiting__Default__PermitLimit}
      Gateway__RateLimiting__Default__WindowSeconds: ${Gateway__RateLimiting__Default__WindowSeconds}

      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    # Waits for the services to answer /health rather than merely for their containers to
    # exist, so the gateway never comes up proxying to something still running migrations.
    depends_on:
      identityservice:
        condition: service_started

      catalogservice:
        condition: service_started

    networks:
      - flowers-network

networks:
  flowers-network:
    driver: bridge

volumes:
  rabbitmq-data:
  redis-data:
  sqlserver-data:

