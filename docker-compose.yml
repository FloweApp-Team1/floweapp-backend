name: floweapp

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped

    ports:
      - "${MSSQL_PORT}:1433"

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - flowers-network
    
  identityservice:
    image: rahmaax/flowerapp-identity-service:${IDENTITY_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: src/Services/IdentityService/Dockerfile
    restart: unless-stopped

    ports:
      - "${IDENTITY_HTTP_PORT}:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: Server=${SQL_SERVER};Database=${DATABASE_NAME};User Id=${SQL_USER};Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;

      # Container path where the secret is mounted (see volumes below).
      # Hardcoded here so it overrides the host path in .env, exactly like the
      # connection string overrides localhost with the sqlserver service name.
      Firebase__CredentialsPath: /run/secrets/firebase-service-account.json

      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: ${RABBITMQ_PORT}
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}

      Redis__ConnectionString: redis:${REDIS_PORT}

      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__AccessTokenExpiryMinutes: ${Jwt__AccessTokenExpiryMinutes}

      Email__SmtpHost: ${Email__SmtpHost}
      Email__SmtpPort: ${Email__SmtpPort}
      Email__SenderEmail: ${Email__SenderEmail}
      Email__SenderName: ${Email__SenderName}
      Email__Username: ${Email__Username}
      Email__Password: ${Email__Password}
      Email__EnableSsl: ${Email__EnableSsl}

    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

    depends_on:
      rabbitmq:
        condition: service_healthy

      redis:
        condition: service_healthy

      sqlserver:
        condition: service_healthy

    networks:
      - flowers-network

  rabbitmq:
    image: rabbitmq:3-management

    restart: unless-stopped

    ports:
      - "${RABBITMQ_PORT}:5672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - flowers-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - flowers-network

networks:
  flowers-network:
    driver: bridge

volumes:
  rabbitmq-data:
  redis-data:
  sqlserver-data:
